name: Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Test and package
        run: ./mvnw -B clean verify

      - name: Upload verified WAR
        uses: actions/upload-artifact@v7
        with:
          name: moa-backend-war-${{ github.sha }}
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: moa-backend-production
      cancel-in-progress: false

    steps:
      - name: Download verified WAR
        uses: actions/download-artifact@v8
        with:
          name: moa-backend-war-${{ github.sha }}
          path: target

      - name: Upload WAR to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: target/*.war
          target: ~/moa-deploy
          strip_components: 1

      - name: Restart service with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -Eeuo pipefail

            APP_DIR=/opt/moa/backend
            APP_WAR="$APP_DIR/moa-0.0.1-SNAPSHOT.war"
            UPLOAD_WAR="$HOME/moa-deploy/moa-0.0.1-SNAPSHOT.war"
            BACKUP_WAR="$APP_WAR.bak.$(date +%Y%m%d%H%M%S)"

            test -s "$UPLOAD_WAR"
            sudo mkdir -p "$APP_DIR"

            if [ -f "$APP_WAR" ]; then
              sudo cp --preserve=mode,ownership,timestamps "$APP_WAR" "$BACKUP_WAR"
            fi

            sudo install -o ubuntu -g ubuntu -m 0644 "$UPLOAD_WAR" "$APP_WAR"
            sudo systemctl restart moa-backend.service

            healthy=false
            for attempt in $(seq 1 18); do
              response=$(curl --silent --fail --max-time 5 \
                http://127.0.0.1:8081/actuator/health || true)
              if echo "$response" | grep -q '"status":"UP"'; then
                healthy=true
                break
              fi
              sleep 5
            done

            if [ "$healthy" != true ]; then
              sudo journalctl -u moa-backend.service -n 80 --no-pager
              if [ -f "$BACKUP_WAR" ]; then
                sudo cp "$BACKUP_WAR" "$APP_WAR"
                sudo chown ubuntu:ubuntu "$APP_WAR"
                sudo systemctl restart moa-backend.service
              fi
              exit 1
            fi

            sudo systemctl is-active --quiet moa-backend.service
            sudo find "$APP_DIR" -maxdepth 1 -type f -name 'moa-0.0.1-SNAPSHOT.war.bak.*' \
              -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | \
              xargs -r sudo rm -f

      - name: Smoke test public API
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail --retry 4 --retry-delay 3 \
            https://api-moa.jyyouk.shop/actuator/health)
          echo "$response" | grep -q '"status":"UP"'
